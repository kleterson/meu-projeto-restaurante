<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Burger & Cia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#ef4444', secondary: '#f59e0b', darkBg: '#0f172a', cardBg: '#1e293b' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center px-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <div class="bg-gradient-to-tr from-red-600 to-amber-500 p-3 rounded-2xl w-14 h-14 mx-auto flex items-center justify-center mb-3">
                    <i class="fa-solid fa-lock text-2xl text-white"></i>
                </div>
                <h2 class="text-2xl font-black text-white">Painel Administrativo</h2>
                <p class="text-slate-400 text-sm mt-1">Entre com suas credenciais para gerenciar o cardápio</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Usuário</label>
                    <input type="text" id="user" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500" placeholder="admin">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Senha</label>
                    <input type="password" id="pass" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-amber-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all text-center">
                    Entrar no Painel
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300">← Voltar para o Cardápio</a>
            </div>
        </div>
    </div>

    <!-- TELA DO PAINEL ADMIN (Oculta até o login) -->
    <div id="admin-panel" class="hidden flex-grow flex flex-col justify-between">
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-gradient-to-tr from-red-600 to-amber-500 p-2.5 rounded-xl">
                        <i class="fa-solid fa-gauge-high text-xl text-white"></i>
                    </div>
                    <div>
                        <span class="text-xl font-extrabold text-white">Burger & Cia</span>
                        <span class="block text-xs text-red-400">Painel de Controle</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-700">
                        <i class="fa-solid fa-eye mr-2"></i> Ver Cardápio
                    </a>
                    <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-4 py-2.5 rounded-xl text-sm font-semibold border border-red-500/20">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Sair
                    </button>
                </div>
            </div>
        </header>

        <main class="py-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-grow">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 pb-6 border-b border-slate-800">
                <div>
                    <h1 class="text-3xl font-black text-white">Gerenciar Produtos</h1>
                    <p class="text-slate-400 text-sm mt-1">Adicione, edite ou remova os itens exibidos no cardápio digital.</p>
                </div>
                <button onclick="openProductModal()" class="bg-gradient-to-r from-red-600 to-amber-500 text-white font-bold px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Novo Produto</span>
                </button>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-950/60 border-b border-slate-800 text-xs uppercase text-slate-400 font-semibold tracking-wider">
                                <th class="p-4">Produto</th>
                                <th class="p-4">Categoria</th>
                                <th class="p-4">Preço</th>
                                <th class="p-4">Descrição</th>
                                <th class="p-4 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products-list" class="divide-y divide-slate-800 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800 mb-4">
                <h3 id="modal-title" class="text-xl font-bold text-white">Novo Produto</h3>
                <button onclick="closeProductModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <form onsubmit="saveProduct(event)" class="space-y-4">
                <input type="hidden" id="prod-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Nome do Produto</label>
                    <input type="text" id="prod-name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Categoria</label>
                        <select id="prod-category" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                            <option value="lanches">Lanches</option>
                            <option value="almoco">Almoço</option>
                            <option value="bebidas">Bebidas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Preço (R$)</label>
                        <input type="number" step="0.01" id="prod-price" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Link da Imagem (URL)</label>
                    <input type="url" id="prod-image" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Descrição</label>
                    <textarea id="prod-desc" rows="3" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeProductModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl text-sm font-semibold">Cancelar</button>
                    <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg text-sm">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const defaultMenuItems = [
            { id: 1, name: "Burger Artesanal Supremo", category: "lanches", price: 32.90, desc: "Pão brioche, carne Angus 180g, cheddar empanado, bacon crocante e molho especial.", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "Double Smash Bacon", category: "lanches", price: 28.90, desc: "Pão tostado na manteiga, dois burgers de 90g, duplo cheddar e bacon em tiras.", image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "X-Salada da Casa", category: "lanches", price: 22.00, desc: "Pão tradicional, hambúrguer suculento, queijo prato, alface fresca e tomate.", image: "https://images.unsplash.com/photo-1572802419362-74b0d5cac0f6?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "Prato Executivo de Contrafilé", category: "almoco", price: 39.90, desc: "Contrafilé grelhado, arroz branco soltinho, feijão carioca, fritas e salada.", image: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "Frango Grelhado com Legumes", category: "almoco", price: 32.50, desc: "Filé de frango suculento acompanhado de mix de legumes na manteiga e arroz integral.", image: "https://images.unsplash.com/photo-1604908176997-125f2596f378?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "Parmegiana de Frango (Individual)", category: "almoco", price: 36.90, desc: "Filé empanado coberto com molho de tomate artesanal, muito queijo e arroz com fritas.", image: "https://images.unsplash.com/photo-1633964913295-ceb43826e7c9?auto=format&fit=crop&w=600&q=80" },
            { id: 7, name: "Coca-Cola Original 350ml", category: "bebidas", price: 6.50, desc: "Lata gelada trincando para acompanhar sua refeição.", image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80" },
            { id: 8, name: "Coca-Cola Zero 2 Litros", category: "bebidas", price: 14.00, desc: "Ideal para compartilhar com a família ou amigos.", image: "https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=600&q=80" },
            { id: 9, name: "Suco Natural de Laranja 500ml", category: "bebidas", price: 9.00, desc: "Feito com frutas frescas espreitadas na hora.", image: "https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=600&q=80" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('admin_logged') === 'true') {
                showAdminPanel();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;

            if(u === 'admin' && p === '123456') {
                localStorage.setItem('admin_logged', 'true');
                showAdminPanel();
            } else {
                alert('Usuário ou senha incorretos! (Padrão: admin / 123456)');
            }
        }

        function logout() {
            localStorage.removeItem('admin_logged');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function showAdminPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            renderAdminProducts();
        }

        function getMenuItems() {
            let items = localStorage.getItem('burger_menu_items');
            if(!items) {
                items = JSON.stringify(defaultMenuItems);
                localStorage.setItem('burger_menu_items', items);
            }
            return JSON.parse(items);
        }

        function saveMenuItems(items) {
            localStorage.setItem('burger_menu_items', JSON.stringify(items));
        }

        function renderAdminProducts() {
            const products = getMenuItems();
            const tbody = document.getElementById('admin-products-list');

            if(products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">Nenhum produto cadastrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = products.map(item => `
                <tr class="hover:bg-slate-800/40 transition-colors">
                    <td class="p-4 flex items-center space-x-3">
                        <img src="${item.image}" alt="" class="w-10 h-10 rounded-lg object-cover border border-slate-700">
                        <span class="font-bold text-white">${item.name}</span>
                    </td>
                    <td class="p-4 capitalize text-slate-300"><span class="bg-slate-800 px-2.5 py-1 rounded-lg text-xs border border-slate-700">${item.category}</span></td>
                    <td class="p-4 font-semibold text-emerald-400">R$ ${item.price.toFixed(2).replace('.', ',')}</td>
                    <td class="p-4 text-slate-400 max-w-xs truncate">${item.desc}</td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick="openProductModal(${item.id})" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-xl border border-slate-700"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="deleteProduct(${item.id})" class="bg-slate-800 hover:bg-slate-700 text-red-400 p-2 rounded-xl border border-slate-700"><i class="fa-solid fa-trash text-xs"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openProductModal(id = null) {
            document.getElementById('product-modal').classList.remove('hidden');
            if(id) {
                document.getElementById('modal-title').textContent = 'Editar Produto';
                const products = getMenuItems();
                const p = products.find(i => i.id === id);
                document.getElementById('prod-id').value = p.id;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-category').value = p.category;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('prod-image').value = p.image;
                document.getElementById('prod-desc').value = p.desc;
            } else {
                document.getElementById('modal-title').textContent = 'Novo Produto';
                document.getElementById('prod-id').value = '';
                document.querySelector('#product-modal form').reset();
            }
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value;
            const category = document.getElementById('prod-category').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const image = document.getElementById('prod-image').value;
            const desc = document.getElementById('prod-desc').value;

            let products = getMenuItems();

            if(id) {
                products = products.map(i => i.id == id ? { id: Number(id), name, category, price, image, desc } : i);
            } else {
                const newId = products.length > 0 ? Math.max(...products.map(i => i.id)) + 1 : 1;
                products.push({ id: newId, name, category, price, image, desc });
            }

            saveMenuItems(products);
            closeProductModal();
            renderAdminProducts();
            alert('Produto salvo com sucesso!');
        }

        function deleteProduct(id) {
            if(confirm('Tem certeza que deseja excluir este produto?')) {
                let products = getMenuItems();
                products = products.filter(i => i.id !== id);
                saveMenuItems(products);
                renderAdminProducts();
            }
        }
    </script>
</body>
</html>
