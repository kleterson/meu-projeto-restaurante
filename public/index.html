<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gonçalves Lanches & Refeições</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: white; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1, h2, h3 { color: #f1c40f; text-align: center; }
        .categoria-box { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #d4af37; }
        .item-card { display: flex; justify-content: space-between; align-items: center; background: #444; padding: 10px 15px; border-radius: 6px; margin-bottom: 10px; }
        button { background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        button:disabled { background: #777; cursor: not-allowed; }
        .carrinho-box { background: #111; padding: 15px; border-radius: 8px; margin-top: 30px; border: 2px solid #27ae60; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; background: #222; color: white; box-sizing: border-box; }
        .esgotado-label { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gonçalves Lanches & Refeições</h1>
    <p style="text-align: center;">Faça seu pedido online de forma rápida e segura!</p>

    <!-- O Cardápio será injetado aqui via JavaScript -->
    <div id="cardapio-container">Carregando cardápio...</div>

    <!-- Carrinho e Finalização -->
    <div class="carrinho-box">
        <h2>Seu Carrinho</h2>
        <div id="carrinho-itens">Nenhum item adicionado.</div>
        <h3>Total Geral: R$ <span id="carrinho-total">0.00</span></h3>

        <hr style="border-color: #444; margin: 20px 0;">

        <h3>Dados para Entrega</h3>
        <label>Nome Completo:</label>
        <input type="text" id="cliente-nome" placeholder="Digite seu nome">

        <label>WhatsApp:</label>
        <input type="text" id="cliente-whatsapp" placeholder="(XX) 9XXXX-XXXX">

        <label>Bairro (Define a Taxa de Entrega):</label>
        <select id="cliente-bairro" onchange="atualizarTotal()">
            <option value="Centro" data-taxa="5.00">Centro - R$ 5,00</option>
            <option value="Bela Vista" data-taxa="7.00">Bela Vista - R$ 7,00</option>
            <option value="Santa Rita" data-taxa="10.00">Santa Rita - R$ 10,00</option>
            <option value="Outros" data-taxa="12.00">Outros Bairros - R$ 12,00</option>
        </select>

        <label>Endereço (Rua e Número):</label>
        <input type="text" id="cliente-endereco" placeholder="Ex: Rua das Flores, 123">

        <label>Ponto de Referência:</label>
        <input type="text" id="cliente-referencia" placeholder="Ex: Próximo ao mercado">

        <label>Forma de Pagamento:</label>
        <select id="forma-pagamento" onchange="verificarFormaPagamento()">
            <option value="Pix">Pix (Aprovação Automática)</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Cartao">Cartão (Na Entrega)</option>
        </select>

        <div id="campo-troco" style="display: none;">
            <label>Troco para quanto?</label>
            <input type="text" id="cliente-troco" placeholder="Ex: R$ 50,00">
        </div>

        <button onclick="finalizarPedido()" style="width: 100%; padding: 12px; font-size: 16px; background: #e67e22; margin-top: 10px;">Finalizar e Enviar Pedido 🚀</button>
    </div>
</div>

<!-- Modal / Área de Pagamento Pix -->
<div id="modal-pix" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
    <div style="background:#333; padding:20px; border-radius:8px; text-align:center; max-width:400px; width:90%;">
        <h3>Pague via Pix para Concluir</h3>
        <p>Escaneie o QR Code abaixo com o aplicativo do seu banco:</p>
        <div id="pix-qrcode-img"></div>
        <p style="font-size: 12px; word-break: break-all; background: #222; padding: 8px;" id="pix-copia-cola"></p>
        <button onclick="copiarPix()" style="background: #3498db; margin-bottom: 10px;">Copiar Código Pix</button>
        <p id="status-pagamento" style="color: #f1c40f; font-weight: bold;">Aguardando pagamento...</p>
        <button onclick="fecharModalPix()" style="background: #e74c3c;">Cancelar / Fechar</button>
    </div>
</div>

<script>
    let carrinho = [];
    let cardapioGlobal = [];
    let idPagamentoAtual = null;
    let intervaloChecagem = null;

    // Buscar o cardápio do servidor ao carregar a página
    async function carregarCardapioCliente() {
        try {
            const res = await fetch('/api/cardapio');
            cardapioGlobal = await res.json();
            renderizarCardapio();
        } catch (e) {
            console.error('Erro ao carregar cardápio', e);
            document.getElementById('cardapio-container').innerHTML = '<p style="color:red; text-align:center;">Erro ao carregar o cardápio. Tente atualizar a página.</p>';
        }
    }

    function renderizarCardapio() {
        const container = document.getElementById('cardapio-container');
        container.innerHTML = '';

        // Agrupar por categoria
        const categorias = {};
        cardapioGlobal.forEach(item => {
            if (!categorias[item.categoria]) categorias[item.categoria] = [];
            categorias[item.categoria].push(item);
        });

        for (let cat in categorias) {
            let htmlItems = '';
            categorias[cat].forEach(item => {
                if (item.esgotado) {
                    htmlItems += `
                        <div class="item-card" style="opacity: 0.6;">
                            <div>
                                <strong>${item.nome}</strong> - R$ ${item.preco.toFixed(2)}
                                <br><span class="esgotado-label">ESGOTADO</span>
                            </div>
                            <button disabled>Indisponível</button>
                        </div>
                    `;
                } else {
                    htmlItems += `
                        <div class="item-card">
                            <div>
                                <strong>${item.nome}</strong> - R$ ${item.preco.toFixed(2)}
                            </div>
                            <button onclick="adicionarAoCarrinho('${item.id}')">Adicionar</button>
                        </div>
                    `;
                }
            });

            container.innerHTML += `
                <div class="categoria-box">
                    <h2>${cat}</h2>
                    ${htmlItems}
                </div>
            `;
        }
    }

    function adicionarAoCarrinho(id) {
        const item = cardapioGlobal.find(i => i.id === id);
        if (item && !item.esgotado) {
            carrinho.push(item);
            atualizarCarrinho();
        }
    }

    function removerDoCarrinho(index) {
        carrinho.splice(index, 1);
        atualizarCarrinho();
    }

    function atualizarCarrinho() {
        const container = document.getElementById('carrinho-itens');
        if (carrinho.length === 0) {
            container.innerHTML = 'Nenhum item adicionado.';
            atualizarTotal();
            return;
        }

        container.innerHTML = '';
        carrinho.forEach((item, index) => {
            container.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <span>${item.nome} - R$ ${item.preco.toFixed(2)}</span>
                    <button onclick="removerDoCarrinho(${index})" style="background:#c0392b; padding: 2px 6px; font-size:12px;">Remover</button>
                </div>
            `;
        });
        atualizarTotal();
    }

    function atualizarTotal() {
        let subtotal = carrinho.reduce((sum, item) => sum + item.preco, 0);
        let selectBairro = document.getElementById('cliente-bairro');
        let taxaEntrega = 0;
        
        if (selectBairro && selectBairro.options[selectBairro.selectedIndex]) {
            taxaEntrega = parseFloat(selectBairro.options[selectBairro.selectedIndex].getAttribute('data-taxa')) || 0;
        }

        let totalGeral = subtotal + taxaEntrega;
        document.getElementById('carrinho-total').innerText = totalGeral.toFixed(2);
    }

    function verificarFormaPagamento() {
        const forma = document.getElementById('forma-pagamento').value;
        const campoTroco = document.getElementById('campo-troco');
        campoTroco.style.display = forma === 'Dinheiro' ? 'block' : 'none';
    }

    async function finalizarPedido() {
        if (carrinho.length === 0) {
            alert('Seu carrinho está vazio!');
            return;
        }

        const nome = document.getElementById('cliente-nome').value.trim();
        const whatsapp = document.getElementById('cliente-whatsapp').value.trim();
        const endereco = document.getElementById('cliente-endereco').value.trim();
        const bairroSelect = document.getElementById('cliente-bairro');
        const bairro = bairroSelect.value;
        const taxa = parseFloat(bairroSelect.options[bairroSelect.selectedIndex].getAttribute('data-taxa')) || 0;
        const referencia = document.getElementById('cliente-referencia').value.trim();
        const formaPagamento = document.getElementById('forma-pagamento').value;
        const troco = document.getElementById('cliente-troco').value.trim();

        if (!nome || !whatsapp || !endereco) {
            alert('Por favor, preencha Nome, WhatsApp e Endereço.');
            return;
        }

        let subtotal = carrinho.reduce((sum, item) => sum + item.preco, 0);
        let totalGeral = subtotal + taxa;
        let codigoPedido = Math.floor(1000 + Math.random() * 9000); // Gerar código de 4 dígitos

        const dadosPedido = {
            codigo: codigoPedido,
            nome,
            whatsapp,
            endereco,
            bairro,
            taxa,
            referencia,
            itens: carrinho,
            total: totalGeral,
            formaPagamento: formaPagamento === 'Dinheiro' ? `Dinheiro (Troco: ${troco || 'Não precisa'})` : formaPagamento
        };

        if (formaPagamento === 'Pix') {
            // Gerar Pix no Mercado Pago
            try {
                const res = await fetch('/api/criar-pagamento', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ total: totalGeral, nome })
                });
                const respMP = await res.json();

                if (respMP.id_pagamento) {
                    idPagamentoAtual = respMP.id_pagamento;
                    document.getElementById('pix-qrcode-img').innerHTML = `<img src="data:image/jpeg;base64,${respMP.qr_code_base64}" style="max-width:200px;"/>`;
                    document.getElementById('pix-copia-cola').innerText = respMP.qr_code;
                    document.getElementById('modal-pix').style.display = 'flex';

                    // Salvar pedido no painel do motoboy como Aguardando Pagamento Pix
                    dadosPedido.status = "⏳ Aguardando Pagamento Pix";
                    await salvarPedidoNoServidor(dadosPedido);

                    // Iniciar verificação de status do pagamento
                    intervaloChecagem = setInterval(verificarStatusPix, 4000);
                } else {
                    alert('Erro ao gerar Pix. Tente novamente.');
                }
            } catch (e) {
                console.error(e);
                alert('Erro de conexão com o sistema de pagamento.');
            }
        } else {
            // Pagamento Dinheiro ou Cartão direto
            dadosPedido.status = "⏳ Aguardando preparo na cozinha";
            await salvarPedidoNoServidor(dadosPedido);
            alert(`Pedido #${codigoPedido} realizado com sucesso! Acompanhe a entrega.`);
            window.location.reload();
        }
    }

    async function salvarPedidoNoServidor(dadosPedido) {
        await fetch('/api/pedidos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dadosPedido)
        });
    }

    function copiarPix() {
        const codigoPix = document.getElementById('pix-copia-cola').innerText;
        navigator.clipboard.writeText(codigoPix).then(() => {
            alert('Código Pix copiado com sucesso!');
        });
    }

    async function verificarStatusPix() {
        if (!idPagamentoAtual) return;
        try {
            const res = await fetch(`/api/verificar-pagamento/${idPagamentoAtual}`);
            const data = await res.json();
            if (data.status === 'approved') {
                clearInterval(intervaloChecagem);
                document.getElementById('status-pagamento').innerText = "Pagamento Aprovado com Sucesso! 🎉";
                setTimeout(() => {
                    alert('Pagamento confirmado! Seu pedido foi enviado para a cozinha.');
                    window.location.reload();
                }, 1500);
            }
        } catch (e) {
            console.error('Erro ao checar pagamento', e);
        }
    }

    function fecharModalPix() {
        if (intervaloChecagem) clearInterval(intervaloChecagem);
        document.getElementById('modal-pix').style.display = 'none';
    }

    // Carregar cardápio ao iniciar a página
    carregarCardapioCliente();
</script>

</body>
</html>
