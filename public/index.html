<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gonçalves Lanches & Refeições</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header-title">
            <h1>Gonçalves Lanches & Refeições</h1>
            <p>Escolha uma categoria para ver o cardápio</p>
        </div>

        <div class="header-actions">
            <span class="delivery-badge">🛵 Delivery Ativo</span>
        </div>

        <hr style="border-color: #d4af37; margin: 20px 0;">

        <!-- Botões das categorias -->
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <button onclick="window.location.href='lanches/index.html'" style="background: #e67e22; font-size: 18px; padding: 15px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">🍔 Lanches Especiais</button>
            <button onclick="window.location.href='refeicoes/index.html'" style="background: #27ae60; font-size: 18px; padding: 15px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">🍲 Pratos e Marmitas (Almoço)</button>
            <button onclick="window.location.href='bebidas/index.html'" style="background: #2980b9; font-size: 18px; padding: 15px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">🥤 Bebidas e Sucos</button>
        </div>
    </div>

    <script src="script.js"></script>

</html>
