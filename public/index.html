<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo em Manutenção</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for WhatsApp Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl text-center relative z-10 transition-all duration-300">
        
        <div class="mb-6 flex justify-center">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/25 animate-float">
                <i class="fa-solid fa-screwdriver-wrench text-3xl text-white"></i>
            </div>
        </div>

        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-3">
            Catálogo em Manutenção
        </h1>
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8">
            Estamos atualizando nossa plataforma para oferecer a você uma experiência ainda melhor. Retornaremos em breve!
        </p>

        <div class="space-y-3">
            <a href="https://wa.me/5511920065761?text=Olá,%20gostaria%20de%20tirar%20dúvidas%20enquanto%20o%20catálogo%20está%20em%20manutenção." 
               target="_blank" 
               rel="noopener noreferrer"
               class="w-full inline-flex items-center justify-center gap-3 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-600/30 transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>Falar com o Suporte</span>
            </a>
            
            <p class="text-xs text-slate-500 pt-2">
                Precisa de ajuda urgente? Clique no botão acima para nos chamar no WhatsApp.
            </p>
        </div>

        <footer class="mt-8 pt-6 border-t border-slate-800/80 text-xs text-slate-500">
            &copy; <span id="year"></span> &bull; Todos os direitos reservados.
        </footer>
    </main>

    <script>
        // Set dynamic current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
