<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio | gonçalves (Lanches & Refeições)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#ef4444', secondary: '#f59e0b', darkBg: '#0f172a', cardBg: '#1e293b' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        .hero-slide { opacity: 0; transition: opacity 1s ease-in-out; position: absolute; inset: 0; display: flex; align-items: center; pointer-events: none; z-index: 10; }
        .hero-slide.active { opacity: 1; pointer-events: auto; z-index: 20; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div id="header-logo-container" class="w-11 h-11 rounded-xl overflow-hidden flex items-center justify-center bg-gradient-to-tr from-red-600 to-amber-500 shadow-md p-2.5">
                    <i id="header-logo-icon" class="fa-solid fa-burger text-2xl text-white"></i>
                    <img id="header-logo-img" src="" alt="" class="w-full h-full object-cover hidden">
                </div>
                <div>
                    <span id="header-brand-name" class="text-2xl font-extrabold text-white">gonçalves (Lanches & Refeições)</span>
                    <span class="block text-xs text-slate-400">Cardápio Digital</span>
                </div>
            </a>
            <div class="flex items-center space-x-4">
                <button onclick="openCart()" class="relative bg-slate-800 hover:bg-slate-700 p-3 rounded-xl border border-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-cart-shopping text-red-500"></i>
                    <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-700">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Início
                </a>
            </div>
        </div>
    </header>

    <!-- Banner Cinematográfico com Slideshow Dinâmico -->
    <section id="hero-banner" class="relative h-[320px] sm:h-[400px] overflow-hidden bg-slate-950 border-b border-slate-800">
        <div id="hero-slides-container" class="relative w-full h-full">
            <!-- Preenchido dinamicamente via API -->
        </div>
        <!-- Indicadores -->
        <div id="hero-dots-container" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-30 flex space-x-2"></div>
    </section>

    <!-- Conteúdo Principal -->
    <main class="py-10 flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">

        <!-- TELA 1: Escolha de Categorias Dinâmicas -->
        <div id="view-categories">
            <div class="text-center max-w-2xl mx-auto mb-10">
                <span class="bg-red-500/20 text-red-400 text-xs sm:text-sm font-bold px-3.5 py-1.5 rounded-full border border-red-500/30 uppercase tracking-wider">Nosso Cardápio</span>
                <h2 class="text-3xl sm:text-4xl font-black text-white mt-3">O que você deseja pedir hoje?</h2>
                <p class="text-slate-400 mt-2 text-sm sm:text-base">Escolha uma das categorias abaixo para ver os itens disponíveis.</p>
            </div>

            <!-- Grade de Categorias Carregadas do Servidor -->
            <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </div>

        <!-- TELA 2: Produtos da Categoria Selecionada (Oculta Inicialmente) -->
        <div id="view-products" class="hidden">
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
                <div>
                    <button onclick="backToCategories()" class="inline-flex items-center space-x-2 text-slate-400 hover:text-white bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700 mb-3 text-sm font-medium transition-colors">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Voltar às Categorias</span>
                    </button>
                    <h2 id="category-title" class="text-3xl font-extrabold text-white capitalize">Categoria</h2>
                </div>
            </div>

            <!-- Grade de Produtos Compacta -->
            <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6"></div>
        </div>
    </main>

    <!-- Carrinho Lateral -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-slate-900 w-full max-w-md h-full flex flex-col justify-between p-6 border-l border-slate-800 shadow-2xl">
            <div>
                <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                    <h3 class="text-xl font-bold text-white flex items-center space-x-2">
                        <i class="fa-solid fa-cart-shopping text-red-500"></i>
                        <span>Seu Carrinho</span>
                    </h3>
                    <button onclick="closeCart()" class="text-slate-400 hover:text-white p-2 text-xl">&times;</button>
                </div>
                <div id="cart-items" class="py-6 space-y-4 overflow-y-auto max-h-[50vh]">
                    <p class="text-slate-500 text-center py-8">Seu carrinho está vazio.</p>
                </div>
            </div>
            <div class="border-t border-slate-800 pt-4 space-y-3">
                <input type="text" id="clienteNome" placeholder="Seu Nome Completo" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                <input type="text" id="clienteEndereco" placeholder="Endereço de Entrega" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                <div class="flex justify-between items-center pt-2">
                    <span class="text-slate-400">Total:</span>
                    <span id="cart-total" class="text-2xl font-extrabold text-white">R$ 0,00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-gradient-to-r from-red-600 to-amber-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all text-center block">
                    <i class="fa-brands fa-whatsapp mr-2"></i> Enviar Pedido no WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        let storeWhatsApp = "5599999999999"; 
        let currentSlideIndex = 0;
        let slideInterval;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(window.location.origin + '/api/configuracoes');
                const config = await res.json();
                if(config) {
                    if(config.nome_loja) {
                        const brandEl = document.getElementById('header-brand-name');
                        if(brandEl) brandEl.textContent = config.nome_loja;
                    }
                    if(config.logo_url && config.logo_url.trim() !== '') {
                        const imgEl = document.getElementById('header-logo-img');
                        const iconEl = document.getElementById('header-logo-icon');
                        const containerEl = document.getElementById('header-logo-container');

                        if(imgEl) {
                            imgEl.src = config.logo_url;
                            imgEl.classList.remove('hidden');
                        }
                        if(iconEl) iconEl.classList.add('hidden');
                        if(containerEl) containerEl.classList.remove('bg-gradient-to-tr', 'from-red-600', 'to-amber-500');
                    }
                    if(config.whatsapp) {
                        storeWhatsApp = config.whatsapp;
                    }
                }
            } catch (err) {
                console.error('Erro ao carregar configurações da loja:', err);
            }

            loadDynamicBanners();
            loadCategories();
            loadProducts();
        });

        async function loadDynamicBanners() {
            try {
                const res = await fetch(window.location.origin + '/api/banners');
                const banners = await res.json();
                
                const container = document.getElementById('hero-slides-container');
                const dotsContainer = document.getElementById('hero-dots-container');

                if(!Array.isArray(banners) || banners.length === 0) {
                    container.innerHTML = `
                        <div class="hero-slide active">
                            <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/70 to-transparent z-10"></div>
                            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1600&q=80" class="absolute inset-0 w-full h-full object-cover opacity-60">
                            <div class="relative z-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full text-center sm:text-left">
                                <h1 class="text-3xl sm:text-5xl font-black text-white">Bem-vindo ao Cardápio</h1>
                            </div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = banners.map((b, i) => `
                    <div class="hero-slide ${i === 0 ? 'active' : ''}">
                        <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/70 to-transparent z-10"></div>
                        <img src="${b.imagem}" class="absolute inset-0 w-full h-full object-cover object-center opacity-60">
                        <div class="relative z-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full text-center sm:text-left">
                            ${b.tag ? `<span class="bg-red-500/20 text-red-400 text-xs sm:text-sm font-bold px-3.5 py-1.5 rounded-full border border-red-500/30 uppercase tracking-wider">${b.tag}</span>` : ''}
                            <h1 class="text-3xl sm:text-5xl font-black mt-4 mb-2 tracking-tight text-white">${b.titulo}</h1>
                            <p class="text-slate-300 text-sm sm:text-base max-w-lg">${b.subtitulo}</p>
                        </div>
                    </div>
                `).join('');

                dotsContainer.innerHTML = banners.map((_, i) => `
                    <button onclick="currentSlide(${i})" class="slide-dot w-2.5 h-2.5 rounded-full ${i === 0 ? 'bg-white' : 'bg-white/50'} transition-all"></button>
                `).join('');

                if(slideInterval) clearInterval(slideInterval);
                
                if(banners.length > 1) {
                    slideInterval = setInterval(() => {
                        const slides = document.querySelectorAll('.hero-slide');
                        if(slides.length === 0) return;
                        currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                        showSlide(currentSlideIndex);
                    }, 4000);
                }

            } catch (err) {
                console.error('Erro ao carregar banners dinâmicos:', err);
            }
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.hero-slide');
            const dots = document.querySelectorAll('.slide-dot');
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
                if(dots[i]) {
                    dots[i].classList.toggle('bg-white', i === index);
                    dots[i].classList.toggle('bg-white/50', i !== index);
                }
            });
            currentSlideIndex = index;
        }

        window.currentSlide = function(index) {
            showSlide(index);
        }

        async function loadCategories() {
            try {
                const response = await fetch(window.location.origin + '/api/categorias');
                const categorias = await response.json();
                
                const grid = document.getElementById('categories-grid');
                if(!grid || !Array.isArray(categorias)) return;

                const cores = [
                    { border: 'hover:border-red-500', bg: 'bg-red-600', shadow: 'shadow-red-600/50', icon: 'fa-burger' },
                    { border: 'hover:border-amber-500', bg: 'bg-amber-500 text-slate-950', shadow: 'shadow-amber-500/50', icon: 'fa-utensils' },
                    { border: 'hover:border-emerald-500', bg: 'bg-emerald-500', shadow: 'shadow-emerald-500/50', icon: 'fa-bottle-water' }
                ];

                grid.innerHTML = categorias.map((cat, index) => {
                    const estilo = cores[index % cores.length];
                    const imagemCat = cat.imagem && cat.imagem.trim() !== '' ? cat.imagem : 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80';
                    return `
                        <div onclick="selectCategory('${cat.nome}')" class="group relative h-80 rounded-2xl overflow-hidden cursor-pointer shadow-2xl border border-slate-700/50 ${estilo.border} transition-all duration-300">
                            <img src="${imagemCat}" alt="${cat.nome}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                            <div class="absolute bottom-0 left-0 right-0 p-6 flex flex-col justify-end">
                                <div class="${estilo.bg} w-12 h-12 rounded-xl flex items-center justify-center mb-3 shadow-lg ${estilo.shadow}">
                                    <i class="fa-solid ${estilo.icon} text-xl"></i>
                                </div>
                                <h3 class="text-2xl font-bold text-white group-hover:text-amber-400 transition-colors capitalize">${cat.nome}</h3>
                                <p class="text-slate-300 text-sm mt-1">Clique para ver os itens disponíveis.</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error('Erro ao carregar categorias no site:', err);
            }
        }

        let menuItems = [];
        let cart = JSON.parse(localStorage.getItem('burger_cart')) || [];
        updateCartUI();

        async function loadProducts() {
            try {
                const response = await fetch(window.location.origin + '/api/produtos');
                const data = await response.json();
                if(Array.isArray(data)) {
                    menuItems = data;
                }
            } catch (err) {
                console.error('Erro ao carregar produtos do servidor:', err);
            }
        }

        window.selectCategory = async function(category) {
            await loadProducts();

            document.getElementById('hero-banner').classList.add('hidden');
            document.getElementById('view-categories').classList.add('hidden');
            document.getElementById('view-products').classList.remove('hidden');
            
            document.getElementById('category-title').textContent = category;

            const grid = document.getElementById('products-grid');
            const filtered = menuItems.filter(i => i.category && i.category.toLowerCase() === category.toLowerCase());

            if(filtered.length === 0) {
                grid.innerHTML = `<p class="text-slate-400 col-span-full text-center py-10">Nenhum produto cadastrado nesta categoria ainda.</p>`;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between group">
                    <div class="relative h-32 sm:h-40 overflow-hidden bg-slate-900">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80'}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute top-2 right-2 bg-slate-900/90 text-white font-bold px-2.5 py-0.5 rounded-full text-xs border border-slate-700">R$ ${Number(item.price || 0).toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="p-3 sm:p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="text-sm sm:text-base font-bold text-white mb-1 leading-tight">${item.name}</h3>
                            <p class="text-slate-400 text-xs mb-3 line-clamp-2">${item.desc || ''}</p>
                        </div>
                        <button onclick="addToCart(${item.id})" class="w-full bg-slate-700 hover:bg-red-600 text-white font-semibold py-2 rounded-lg transition-colors flex items-center justify-center space-x-1.5 text-xs sm:text-sm">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                            <span>Adicionar</span>
                        </button>
                    </div>
                </div>
            `).join('');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.backToCategories = function() {
            document.getElementById('hero-banner').classList.remove('hidden');
            document.getElementById('view-products').classList.add('hidden');
            document.getElementById('view-categories').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addToCart = function(id) {
            const item = menuItems.find(i => i.id == id);
            if(!item) return;
            const existing = cart.find(i => i.id == id);
            if(existing) existing.qty++;
            else cart.push({ ...item, price: Number(item.price || 0), qty: 1 });
            
            saveCart();
            updateCartUI();
        }

        window.removeFromCart = function(id) {
            cart = cart.filter(i => i.id != id);
            saveCart();
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem('burger_cart', JSON.stringify(cart));
        }

        function updateCartUI() {
            const countEl = document.getElementById('cart-count');
            const itemsEl = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');

            countEl.textContent = cart.reduce((sum, i) => sum + i.qty, 0);

            if(cart.length === 0) {
                itemsEl.innerHTML = `<p class="text-slate-500 text-center py-8">Seu carrinho está vazio.</p>`;
                totalEl.textContent = "R$ 0,00";
                return;
            }

            let total = 0;
            itemsEl.innerHTML = cart.map(item => {
                let itemTotal = item.price * item.qty;
                total += itemTotal;
                return `
                    <div class="flex items-center justify-between bg-slate-800/40 p-3 rounded-xl border border-slate-700/50">
                        <div>
                            <h4 class="text-sm font-bold text-white">${item.name}</h4>
                            <span class="text-xs text-slate-400">R$ ${item.price.toFixed(2).replace('.', ',')} x ${item.qty}</span>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-400 p-2"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                `;
            }).join('');
            totalEl.textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        window.openCart = () => document.getElementById('cart-modal').classList.remove('hidden');
        window.closeCart = () => document.getElementById('cart-modal').classList.add('hidden');

        window.checkout = function() {
            if(cart.length === 0) return alert('Seu carrinho está vazio!');
            let nome = document.getElementById('clienteNome').value.trim();
            let endereco = document.getElementById('clienteEndereco').value.trim();
            if(!nome || !endereco) return alert('Por favor, preencha seu nome e o endereço de entrega.');

            let message = `*Novo Pedido - Cardápio*%0A*Cliente:* ${nome}%0A*Endereço:* ${endereco}%0A%0A*Itens:*%0A`;
            cart.forEach(i => { message += `- ${i.qty}x ${i.name} (R$ ${(i.price * i.qty).toFixed(2)})%0A`; });
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            message += `%0A*Total:* R$ ${total.toFixed(2)}`;
            
            window.open(`https://wa.me/${storeWhatsApp}?text=${message}`, '_blank');

            cart = [];
            saveCart();
            updateCartUI();
            closeCart();
        }
    </script>
</body>
</html>
