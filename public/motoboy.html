<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Gonçalves Lanches</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="background: #1e1e1e; color: white; padding: 20px;">
    <div class="container" style="max-width: 1000px; margin: auto;">
        <h1 style="text-align: center; color: #f1c40f; margin-bottom: 20px;">PAINEL DE GERENCIAMENTO</h1>

        <!-- Botões de Navegação entre Cardápios -->
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;">
            <button onclick="mudarTipoCardapio('almoco')" id="btn-almoco" style="background: #d35400; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">🍲 Gerenciar Almoço</button>
            <button onclick="mudarTipoCardapio('lanches')" id="btn-lanches" style="background: #e67e22; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">🍔 Gerenciar Lanches</button>
            <button onclick="mudarTipoCardapio('bebidas')" id="btn-bebidas" style="background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">🥤 Gerenciar Bebidas</button>
            <button onclick="limparHistorico()" style="background: #c0392b; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">🗑️ Limpar Histórico de Pedidos</button>
        </div>

        <div style="text-align: center; margin-bottom: 15px;">
            <a href="/" style="color: #f1c40f; text-decoration: none; font-weight: bold;">🏠 Voltar para a Página Inicial do Cliente</a>
        </div>

        <!-- Seção de Cadastro de Novo Item -->
        <div style="background: #2c2c2c; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #444;">
            <h3 style="color: #2ecc71; margin-top: 0;">➕ Adicionar Novo Item no Cardápio Atual</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: center;">
                <input type="text" id="novo-categoria" placeholder="Categoria (ex: Refrigerantes, Prato do Dia)" style="padding: 8px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                <input type="text" id="novo-nome" placeholder="Nome do Produto" style="padding: 8px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                <input type="number" id="novo-preco" placeholder="Preço (Ex: 10.00)" step="0.01" style="padding: 8px; border-radius: 4px; border: 1px solid #555; background: #333; color: white;">
                <button onclick="adicionarItemCardapio()" style="background: #27ae60; color: white; border: none; padding: 9px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">Salvar Item</button>
            </div>
        </div>

        <h2 id="titulo-painel" style="color: #f1c40f; border-bottom: 2px solid #444; padding-bottom: 5px;">Gerenciamento do Cardápio</h2>
        
        <!-- Lista Dinâmica de Produtos no Painel -->
        <div id="painel-lista-produtos">Carregando cardápio...</div>

        <h2 style="color: #f1c40f; margin-top: 40px; border-bottom: 2px solid #444; padding-bottom: 5px;">📦 Pedidos Recebidos</h2>
        <div id="painel-pedidos">Nenhum pedido no momento.</div>
    </div>

    <script>
        let tipoAtual = 'almoco';

        function mudarTipoCardapio(tipo) {
            tipoAtual = tipo;
            carregarCardapioPainel();
        }

        async function carregarCardapioPainel() {
            try {
                const res = await fetch('/api/cardapio');
                const itens = await res.json();
                const container = document.getElementById('painel-lista-produtos');
                const titulo = document.getElementById('titulo-painel');

                if (tipoAtual === 'lanches') titulo.innerText = '🍔 Gerenciamento - Cardápio de Lanches';
                else if (tipoAtual === 'bebidas') titulo.innerText = '🥤 Gerenciamento - Cardápio de Bebidas';
                else titulo.innerText = '🍲 Gerenciamento - Cardápio de Almoço';

                const filtrados = itens.filter(i => i.tipo === tipoAtual);
                container.innerHTML = '';

                if (filtrados.length === 0) {
                    container.innerHTML = '<p style="color: #888;">Nenhum item cadastrado nesta categoria.</p>';
                    return;
                }

                filtrados.forEach(item => {
                    const div = document.createElement('div');
                    div.style.cssText = "background: #2c2c2c; padding: 10px 15px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444;";
                    div.innerHTML = `
                        <div>
                            <span style="font-size: 12px; color: #f1c40f; text-transform: uppercase;">[${item.categoria}]</span><br>
                            <span style="font-weight: bold; font-size: 15px;">${item.nome}</span> - <span style="color: #2ecc71;">R$ ${item.preco.toFixed(2)}</span>
                            <span style="font-size: 12px; margin-left: 10px; color: ${item.esgotado ? '#e74c3c' : '#2ecc71'};">(${item.esgotado ? 'ESGOTADO' : 'DISPONÍVEL'})</span>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button onclick="alternarEsgotado('${item.id}')" style="background: ${item.esgotado ? '#27ae60' : '#c0392b'}; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">
                                ${item.esgotado ? 'Disponibilizar' : 'Esgotar'}
                            </button>
                            <button onclick="excluirItem('${item.id}')" style="background: #444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">Excluir</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                console.error("Erro ao carregar painel:", e);
            }
        }

        async function adicionarItemCardapio() {
            const categoria = document.getElementById('novo-categoria').value;
            const nome = document.getElementById('novo-nome').value;
            const preco = document.getElementById('novo-preco').value;

            if (!nome || !preco) {
                alert('Preencha pelo menos o nome e o preço!');
                return;
            }

            await fetch('/api/cardapio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tipo: tipoAtual, categoria, nome, preco })
            });

            document.getElementById('novo-categoria').value = '';
            document.getElementById('novo-nome').value = '';
            document.getElementById('novo-preco').value = '';
            carregarCardapioPainel();
        }

        async function alternarEsgotado(id) {
            await fetch(`/api/cardapio/${id}/toggle`, { method: 'POST' });
            carregarCardapioPainel();
        }

        async function excluirItem(id) {
            if (confirm('Deseja realmente excluir este item?')) {
                await fetch(`/api/cardapio/${id}`, { method: 'DELETE' });
                carregarCardapioPainel();
            }
        }

        async function carregarPedidos() {
            try {
                const res = await fetch('/api/pedidos');
                const pedidos = await res.json();
                const container = document.getElementById('painel-pedidos');
                container.innerHTML = '';

                if (pedidos.length === 0) {
                    container.innerHTML = '<p style="color: #888;">Nenhum pedido recebido no momento.</p>';
                    return;
                }

                pedidos.reverse().forEach(p => {
                    const div = document.createElement('div');
                    div.style.cssText = "background: #2c2c2c; padding: 15px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #f1c40f;";
                    
                    let itensHtml = p.itens.map(i => `<li>${i.nome} - R$ ${i.preco.toFixed(2)}</li>`).join('');
                    
                    div.innerHTML = `
                        <h4 style="margin: 0 0 5px 0; color: #f1c40f;">Pedido #${p.codigo} - ${p.nome}</h4>
                        <p style="margin: 3px 0;"><strong>WhatsApp:</strong> ${p.whatsapp}</p>
                        <p style="margin: 3px 0;"><strong>Endereço:</strong> ${p.endereco} (${p.bairro})</p>
                        <p style="margin: 3px 0;"><strong>Pagamento:</strong> ${p.formaPagamento}</p>
                        <p style="margin: 3px 0;"><strong>Itens:</strong></p>
                        <ul style="margin: 0 0 5px 20px; padding: 0;">${itensHtml}</ul>
                        <p style="margin: 5px 0 0 0; font-weight: bold; color: #2ecc71;">Total: R$ ${p.total.toFixed(2)}</p>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {}
        }

        async function limparHistorico() {
            if (confirm('Deseja limpar todo o histórico de pedidos?')) {
                await fetch('/api/pedidos', { method: 'DELETE' });
                carregarPedidos();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            carregarCardapioPainel();
            carregarPedidos();
            setInterval(carregarPedidos, 5000);
        });
    </script>
</body>
</html>
